[project]
name = "iaminjamul-agent-system"
version = "0.1.0"
description = "Autonomous Multi-Agent Job System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.2.0",
    "supabase>=2.0.0",
    "playwright>=1.40.0",
    "google-api-python-client>=2.100.0",
    "python-dotenv>=1.0.0"
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[tool.pylance]
pythonPath = ".venv/Scripts/python.exe"
